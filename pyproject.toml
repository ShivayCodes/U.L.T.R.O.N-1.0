[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ultron-1-0"
version = "1.1.0"
description = "ULTRON assistant with local memory, a Windows desktop GUI, and optional AI model backends"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ShivayCodes" }]
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=4"]
spreadsheets = ["openpyxl>=3.1"]
image-ocr = ["pillow>=10", "pytesseract>=0.3.10"]
image-classification = ["pillow>=10", "torch>=2", "transformers>=4.40"]

[project.scripts]
ruller-ai = "ruller_ai.cli:main"

[project.gui-scripts]
ultron-gui = "ruller_ai.gui:main"

[tool.setuptools.packages.find]
include = ["ruller_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
